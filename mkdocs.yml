site_name: Data Engineering Notes
site_description: Streaming, Spark, and lakehouse notes from six years in fintech data engineering
site_url: https://hoile9119.github.io/de-notes/
repo_url: https://github.com/hoile9119/de-notes
repo_name: hoile9119/de-notes
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Streaming:
      - Overview: streaming/index.md
      - Kafka:
          - Avro and Schema Registry: streaming/kafka/avro-and-schema-registry.md
      - Apache Flink:
          - Overview: streaming/apache-flink/index.md
          - Architecture Overview: streaming/apache-flink/architecture.md
          - Architecture Walkthrough: streaming/apache-flink/architecture-walkthrough.md
          - Development and Deployment: streaming/apache-flink/development-and-deployment.md
          - Concepts:
              - "Kafka Source": streaming/apache-flink/concepts/kafka-source.md
              - "Table API and DataStream API": streaming/apache-flink/concepts/table-and-datastream-api.md
              - "Time and Watermarks": streaming/apache-flink/concepts/time-and-watermarks.md
              - "Windows and Joins": streaming/apache-flink/concepts/windows-and-joins.md
              - "State, Checkpoints and Savepoints": streaming/apache-flink/concepts/state-and-checkpoints.md
              - "PyFlink Execution Model": streaming/apache-flink/concepts/pyflink-execution-model.md
              - "Sinks and Delivery Guarantees": streaming/apache-flink/concepts/sinks-and-delivery-guarantees.md
  - Spark:
      - Overview: spark/index.md
      - PySpark Function Reference: spark/pyspark-functions.md
      - Recipes:
          - spark/recipes/index.md
          - HDFS Helper: spark/recipes/hdfs.md
          - Impala Client: spark/recipes/impala.md
          - JSON Flattener: spark/recipes/json.md
          - Nested XML with XSD: spark/recipes/xml.md
          - Write Table: spark/recipes/write.md
          - Webhook Sender: spark/recipes/webhook.md
  - Lakehouse:
      - Overview: lakehouse/index.md
      - Table Formats: lakehouse/table-formats.md
  - Databricks: databricks/index.md
  - Architecture: architecture/index.md
  - Platform:
      - Overview: platform/index.md
      - Containerization: platform/containerization.md
      - Local LLMs: platform/local-llms.md
  - Tools: tools/index.md
  - About: about.md

theme:
  name: material
  palette:
    - scheme: slate
      primary: light-blue
      accent: light-blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: light-blue
      accent: light-blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.select
    - content.code.annotate

extra_css:
  - assets/global.css

extra_javascript:
  - https://unpkg.com/mermaid@10.9.0/dist/mermaid.min.js
  - assets/mermaid-theme.js

plugins:
  - search
  - mkdocs-video
  - mkdocs-pdf
  - mkdocs-jupyter:
        ignore_h1_titles: True

markdown_extensions:
  - tables
  - admonition
  - def_list
  - sane_lists
  - md_in_html
  - attr_list
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.critic
  - pymdownx.magiclink
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
